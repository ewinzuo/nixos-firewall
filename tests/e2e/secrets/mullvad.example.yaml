# Schema for the encrypted Mullvad credentials used by the e2e test.
#
# This file is the PLAINTEXT TEMPLATE. Do NOT commit a populated copy here.
# The encrypted real version lives at tests/e2e/secrets/mullvad.yaml and is
# managed by sops:
#
#   sops tests/e2e/secrets/mullvad.yaml   # create / edit
#   sops --decrypt tests/e2e/secrets/mullvad.yaml   # view (the runner does this)
#
# All values come from your Mullvad account → WireGuard config download.
# These are TEST-ENVIRONMENT credentials — they only ever live in an
# ephemeral QEMU VM and never deploy to your real firewall.

mullvad:
  endpoint: "185.213.154.68"            # Mullvad server IP
  port: 51820                           # Mullvad server WireGuard port
  serverKey: "REPLACE_WITH_SERVER_PUBLIC_KEY"
  address: "10.68.1.42/32"              # tunnel address Mullvad assigned you
  privateKey: "REPLACE_WITH_YOUR_PRIVATE_KEY"
