# Production Mullvad secrets — encrypted with sops-nix.
#
# To create the real encrypted file:
#   1. Get the firewall's age pubkey (from SSH host key):
#        ssh root@192.168.1.1 "cat /etc/ssh/ssh_host_ed25519_key.pub" | ssh-to-age
#   2. Add that pubkey to .sops.yaml under &firewall_prod
#   3. Create the encrypted file:
#        sops secrets/mullvad.yaml
#   4. Enter the WireGuard private key as the value for mullvad-private-key
#
# At boot, sops-nix decrypts this to /run/secrets/mullvad-private-key
# on tmpfs — it never touches the disk unencrypted.

mullvad-private-key: "REPLACE_WITH_WIREGUARD_PRIVATE_KEY"
